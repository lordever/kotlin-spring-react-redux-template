spring.application.name=time-tracking-bff

# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE}

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# CORS: allow local frontend during development
spring.webflux.cors.allowed-origins=${SPRING_CORS_ALLOWED_ORIGINS}
spring.webflux.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.webflux.cors.allowed-headers=*
spring.webflux.cors.exposed-headers=*
spring.webflux.cors.allow-credentials=true

# Logging
logging.level.org.springframework.data.mongodb.core.ReactiveMongoTemplate=DEBUG
logging.level.com.kotlin_spring_mongodb=DEBUG

# Database Management
app.database.clear-on-startup=${APP_DATABASE_CLEAR_ON_STARTUP:true}
